basePath: /api/v1/ums
definitions:
  auth.GuestRequest:
    properties:
      email:
        type: string
      name:
        type: string
      org_id:
        type: string
    required:
    - org_id
    type: object
  auth.GuestResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      is_new:
        type: boolean
      user_id:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.UserAuthResponse'
    type: object
  auth.UserAuthResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      org_id:
        type: string
      org_slug:
        type: string
      status:
        type: string
      user_type:
        type: string
    type: object
  organizations.CreateOrgRequest:
    properties:
      domain:
        type: string
      name:
        maxLength: 200
        minLength: 2
        type: string
      plan:
        enum:
        - free
        - pro
        - enterprise
        type: string
      slug:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    - slug
    type: object
  organizations.OrgResponse:
    properties:
      created_at:
        type: string
      domain:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      logo_url:
        type: string
      name:
        type: string
      plan:
        type: string
      role_count:
        type: integer
      slug:
        type: string
      updated_at:
        type: string
      user_count:
        description: Stats
        type: integer
    type: object
  organizations.UpdateOrgRequest:
    properties:
      domain:
        type: string
      name:
        maxLength: 200
        minLength: 2
        type: string
      plan:
        enum:
        - free
        - pro
        - enterprise
        type: string
    type: object
  organizations.UpdateOrgStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  permissions.CreatePermissionRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        minLength: 3
        type: string
      org_id:
        type: string
    required:
    - code
    - name
    type: object
  permissions.PermissionResponse:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      org_id:
        type: string
      org_name:
        type: string
    type: object
  permissions.UpdatePermissionRequest:
    properties:
      description:
        type: string
      name:
        minLength: 3
        type: string
    required:
    - name
    type: object
  role_permissions.AssignPermissionRequest:
    properties:
      permission_id:
        type: integer
    required:
    - permission_id
    type: object
  role_permissions.BulkAssignPermissionRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  roles.CreateRoleRequest:
    properties:
      code:
        minLength: 3
        type: string
      description:
        type: string
      name:
        minLength: 3
        type: string
      org_id:
        type: string
    required:
    - code
    - name
    type: object
  roles.RoleResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      org_id:
        type: string
      org_name:
        type: string
      updated_at:
        type: string
    type: object
  roles.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        minLength: 3
        type: string
    required:
    - name
    type: object
  roles.UpdateRoleStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  user_hierarchy.AssignChildRequest:
    properties:
      child_user_id:
        type: string
    required:
    - child_user_id
    type: object
  user_hierarchy.CheckHierarchyRequest:
    properties:
      child_user_id:
        type: string
      parent_user_id:
        type: string
    required:
    - child_user_id
    - parent_user_id
    type: object
  user_hierarchy.CheckHierarchyResponse:
    properties:
      is_related:
        type: boolean
    type: object
  user_permissions.AssignPermissionsRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  user_permissions.RemovePermissionsRequest:
    properties:
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - permission_ids
    type: object
  user_roles.AssignRolesRequest:
    properties:
      role_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - role_ids
    type: object
  user_roles.RemoveRolesRequest:
    properties:
      role_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - role_ids
    type: object
  users.ChangePasswordRequest:
    properties:
      password:
        maxLength: 32
        minLength: 8
        type: string
    required:
    - password
    type: object
  users.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 50
        minLength: 2
        type: string
      org_id:
        type: string
      password:
        maxLength: 32
        minLength: 8
        type: string
      phone:
        type: string
      user_type:
        enum:
        - admin
        - customer
        - member
        type: string
    required:
    - email
    - name
    - password
    type: object
  users.RoleInfo:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  users.UpdateStatusRequest:
    properties:
      status:
        enum:
        - active
        - inactive
        - blocked
        type: string
    required:
    - status
    type: object
  users.UpdateUserRequest:
    properties:
      name:
        maxLength: 50
        minLength: 2
        type: string
      phone:
        type: string
    type: object
  users.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      org_id:
        type: string
      org_name:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/users.RoleInfo'
        type: array
      status:
        type: string
      updated_at:
        type: string
      user_type:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@ums.com
    name: UMS Support
  description: User Management System — centralized identity and access management.
  termsOfService: http://swagger.io/terms/
  title: UMS Backend API
  version: "1.0"
